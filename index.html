<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Renze Roodbaard — De Kroniek</title>
<style>
:root{
  /* Palet: een leren tafelblad met perkament erop. Geen cremekleurige pagina. */
  --leer:#221812;
  --leer-licht:#3b2a1c;
  --leer-naad:#6b4f31;
  --perkament:#e6d8b4;
  --perkament-diep:#d6c295;
  --perkament-schaduw:#a98f66;
  --inkt:#241a10;
  --inkt-bleek:#63513a;
  --inkt-tweede:#3d2f4a;      /* tweede schrijvershand, paarsig gal */
  --zegel:#7d1f1a;
  --verguld:#b28a3c;

  --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
  --kapitaal:'Hoefler Text',Baskerville,'Times New Roman',serif;
  --hand:'Segoe Script','Bradley Hand','Brush Script MT','Comic Sans MS',cursive;

  --blad:34rem;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--leer);
  background-image:
    radial-gradient(120% 80% at 50% -10%, #3a291b 0%, transparent 60%),
    repeating-linear-gradient(96deg, rgba(0,0,0,.16) 0 2px, transparent 2px 7px),
    repeating-linear-gradient(4deg, rgba(255,255,255,.03) 0 1px, transparent 1px 5px);
  color:var(--perkament);
  font-family:var(--serif);
  font-size:17px;
  line-height:1.62;
  min-height:100vh;
  padding:1rem .75rem 6.5rem;
  -webkit-text-size-adjust:100%;
}

/* ---------- Het vel perkament: een fysiek object op de tafel ---------- */
.blad{
  position:relative;
  max-width:var(--blad);
  margin:0 auto 1rem;
  background:var(--perkament);
  background-image:
    radial-gradient(80% 60% at 15% 10%, rgba(255,255,255,.5), transparent 70%),
    radial-gradient(70% 50% at 90% 95%, rgba(120,90,45,.22), transparent 70%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='k'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23k)' opacity='.16'/></svg>");
  color:var(--inkt);
  padding:1.4rem 1.35rem 1.6rem;
  box-shadow:0 14px 28px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.15) inset;
  clip-path:polygon(0.4% 0.6%, 99.3% 0%, 100% 99.2%, 0.8% 100%);
  animation:leggen .45s ease-out both;
}
.blad--dun{padding:1rem 1.1rem 1.15rem}
@keyframes leggen{from{opacity:0;transform:translateY(10px) rotate(-.25deg)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.blad{animation:none}}

.kop{
  font-family:var(--kapitaal);
  font-size:.78rem;
  letter-spacing:.24em;
  text-transform:uppercase;
  color:var(--inkt-bleek);
  margin:0 0 .15rem;
}
h1,h2{font-family:var(--serif);font-weight:600;line-height:1.15;margin:.1rem 0 .9rem}
h1{font-size:1.6rem}
h2{font-size:1.24rem}
p{margin:0 0 .85rem}
.blad p:first-of-type::first-letter{
  float:left;font-size:3.1rem;line-height:.82;padding:.12rem .34rem 0 0;
  color:var(--zegel);font-family:var(--serif);
}
.regel{border:0;border-top:1px solid var(--perkament-schaduw);margin:1.1rem 0 .9rem}

/* ---------- Beeldplaat: foto als die er is, anders een inkt-ets ---------- */
.plaat{
  position:relative;margin:0 0 1.1rem;aspect-ratio:3/2;overflow:hidden;
  background:var(--perkament-diep);
  border:1px solid var(--perkament-schaduw);
  box-shadow:0 1px 6px rgba(0,0,0,.18) inset;
}
.plaat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.plaat .ets{position:absolute;inset:0;display:grid;place-items:center;padding:6%}
.plaat .ets svg{width:100%;height:100%}
.plaat--klein{aspect-ratio:1/1;margin:0}

/* ---------- Keuzes ---------- */
.keuzes{display:grid;gap:.55rem;margin-top:.4rem}
button{font:inherit;cursor:pointer}
.keuze{
  display:block;width:100%;text-align:left;
  background:transparent;color:var(--inkt);
  border:1px solid var(--perkament-schaduw);
  border-left:4px solid var(--zegel);
  padding:.7rem .85rem;
  transition:background .15s,transform .15s;
}
.keuze:hover,.keuze:focus-visible{background:rgba(125,31,26,.09)}
.keuze:active{transform:translateY(1px)}
.keuze small{display:block;color:var(--inkt-bleek);font-size:.82rem;line-height:1.35}
.keuze small.kenmerken{margin-top:.25rem;font-style:italic;opacity:.75;font-size:.74rem}
.knop{
  background:var(--zegel);color:#f2e6c8;border:1px solid #521310;
  padding:.6rem 1.05rem;font-family:var(--kapitaal);
  letter-spacing:.14em;text-transform:uppercase;font-size:.76rem;
}
.knop--stil{background:transparent;color:var(--inkt);border-color:var(--perkament-schaduw)}
:focus-visible{outline:2px solid var(--verguld);outline-offset:2px}

/* ---------- Persoonskaart ---------- */
.hand{font-family:var(--hand);font-size:1.02rem;line-height:1.5}
.inschrijving{margin:0 0 .55rem;padding-left:.2rem}
.inschrijving--tweede{color:var(--inkt-tweede);transform:rotate(-.5deg)}
.inschrijving--derde{color:#4a3a22;transform:rotate(.35deg)}
.doorgestreept{position:relative;opacity:.62}
.doorgestreept::after{
  content:"";position:absolute;left:-2%;right:-2%;top:52%;height:2px;
  background:var(--inkt);transform:rotate(-.8deg);border-radius:2px;
}
.waarden{display:grid;grid-template-columns:repeat(2,1fr);gap:.45rem .9rem;margin:.4rem 0 .2rem}
.waarde{display:flex;justify-content:space-between;gap:.5rem;border-bottom:1px dotted var(--perkament-schaduw);padding-bottom:.15rem}
.waarde b{font-weight:600}
.label{font-family:var(--kapitaal);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--inkt-bleek)}

/* Het zegel — het signatuurmoment van de app */
.zegel{width:5.4rem;height:5.4rem;margin:.6rem auto 0;display:block}
.zegel--druk{animation:drukken .9s cubic-bezier(.2,1.4,.4,1) both}
@keyframes drukken{0%{transform:scale(2.4) rotate(-14deg);opacity:0}55%{transform:scale(.94) rotate(2deg);opacity:1}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.zegel--druk{animation:none}}

/* ---------- Uitrusting ---------- */
.lagen{display:grid;gap:.6rem}
.laag{display:grid;grid-template-columns:3.6rem 1fr;gap:.75rem;align-items:center;border-bottom:1px solid var(--perkament-schaduw);padding-bottom:.6rem}
.laag .naam{font-weight:600}
.laag .cijfers{font-size:.82rem;color:var(--inkt-bleek)}
.kies{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.35rem}
.kies button{border:1px solid var(--perkament-schaduw);background:transparent;color:var(--inkt);padding:.28rem .55rem;font-size:.82rem}
.kies button[aria-pressed="true"]{background:var(--inkt);color:var(--perkament)}

/* ---------- Duel ---------- */
.tegen{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-bottom:.8rem;text-align:center}
.balk{height:.5rem;background:var(--perkament-diep);border:1px solid var(--perkament-schaduw);margin-top:.25rem}
.balk i{display:block;height:100%;background:var(--zegel);transition:width .3s}
.beat{border-left:3px solid var(--perkament-schaduw);padding-left:.7rem;margin:0 0 .5rem;font-size:.93rem}
.raad{font-family:var(--hand);color:var(--inkt-tweede)}

/* ---------- Kaart ---------- */
.kaart{width:100%;height:100%;display:block}
.kaart text{font-family:var(--kapitaal);font-size:26px;fill:var(--inkt);letter-spacing:.08em}
.kaart .mist{fill:var(--perkament-diep);opacity:.94}
.plattegrond{width:100%;height:auto;display:block;margin:.7rem 0 0;border:1px solid var(--perkament-schaduw)}
.kaart-viewport{position:relative;overflow:hidden;aspect-ratio:1448/1086;background:#d8c493;border:1px solid var(--perkament-schaduw);touch-action:pan-y;cursor:grab}
.kaart-viewport--gezoomd{touch-action:none;cursor:grab}
.kaart-viewport--sleept{cursor:grabbing}
.kaart-zoom{position:absolute;top:0;left:0;width:100%;height:100%;transform-origin:0 0}
.kaart-hotspots{position:absolute;inset:0;pointer-events:none}
/* Positie wordt door JS in px gezet (fx/fy volgen de zoom); de grootte zelf
   blijft vast, zodat markers relatief kleiner ogen naarmate je verder inzoomt. */
.hotspot{position:absolute;pointer-events:auto;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.12rem;background:none;border:0;padding:.3rem;margin:0;cursor:pointer;text-align:center;z-index:2}
.hotspot .merk{width:.9rem;height:.9rem;border-radius:50%;border:1.5px solid rgba(125,31,26,.7);background:rgba(242,230,200,.4);display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s,background .15s,border-color .15s}
.hotspot .merk svg{width:55%;height:55%}
.hotspot .merk svg path{stroke:#7d1f1a;stroke-width:3;stroke-linecap:round}
.hotspot .label{font-family:var(--kapitaal);font-size:.56rem;letter-spacing:.04em;text-transform:uppercase;color:var(--inkt);background:rgba(242,230,200,.5);padding:.04rem .32rem;white-space:nowrap;border:1px solid rgba(157,138,93,.4);opacity:.7;transition:opacity .15s,background .15s}
.hotspot:hover .merk,.hotspot:focus-visible .merk{background:rgba(125,31,26,.3);border-color:#7d1f1a;transform:scale(1.3)}
.hotspot:hover .label,.hotspot:focus-visible .label{opacity:1;background:rgba(242,230,200,.94)}
.hotspot--dicht .merk{opacity:.4;border-style:dashed}
.hotspot--dicht .label{opacity:.4}
.kaart-knoppen{position:absolute;right:.5rem;bottom:.5rem;display:flex;flex-direction:column;gap:.3rem;z-index:3}
.kaart-knoppen button{width:1.9rem;height:1.9rem;border-radius:50%;border:1px solid var(--perkament-schaduw);background:rgba(242,230,200,.88);color:var(--inkt);font-size:1rem;line-height:1;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.kaart-knoppen button:active{background:rgba(125,31,26,.15)}
.kaart-wenk{margin:.55rem 0 0;font-size:.82rem;color:var(--inkt-bleek)}

/* ---------- Onderriem ---------- */
.riem{
  position:fixed;left:0;right:0;bottom:0;z-index:9;
  display:flex;justify-content:center;gap:.2rem;
  background:linear-gradient(#4a341f,#2c1e13);
  border-top:2px solid var(--leer-naad);
  box-shadow:0 -6px 16px rgba(0,0,0,.5);
  padding:.45rem .4rem calc(.45rem + env(safe-area-inset-bottom));
}
.riem button{
  background:transparent;border:0;color:#c9b183;
  font-family:var(--kapitaal);font-size:.66rem;letter-spacing:.13em;text-transform:uppercase;
  padding:.5rem .5rem;display:grid;gap:.2rem;justify-items:center;
  border-bottom:2px solid transparent;
}
.riem button[aria-current="true"]{color:#f0dda9;border-bottom-color:var(--verguld)}
.riem svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5}

/* Ontwikkelknoppen: snel wissen of doorspringen om nieuwe onderdelen te controleren */
.ontwikkel{position:fixed;top:.5rem;right:.5rem;z-index:20;display:flex;gap:.4rem}
.herstart{
  background:rgba(34,24,18,.88);color:#d9c393;border:1px solid var(--leer-naad);
  font-family:var(--kapitaal);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
  padding:.4rem .6rem;border-radius:2px;
}
.herstart:hover,.herstart:focus-visible{color:#f0dda9;border-color:var(--verguld)}

/* Tussendoorscherm: een los briefje bovenop de kaart, voor een route- of onderweg-keuze */
.overlay-achtergrond{
  position:fixed;inset:0;z-index:15;
  background:rgba(12,8,5,.62);
  display:grid;place-items:center;
  padding:1rem;
}
.overlay-blad{
  max-width:26rem;width:100%;
  background:var(--perkament);color:var(--inkt);
  padding:1.1rem 1.15rem 1.3rem;
  box-shadow:0 16px 36px rgba(0,0,0,.6);
  clip-path:polygon(0.6% 0.8%, 99% 0%, 100% 99%, 1% 100%);
  animation:leggen .3s ease-out both;
  max-height:88vh;overflow-y:auto;
}
.fluister{font-family:var(--hand);color:var(--inkt-tweede);margin:.2rem 0 .5rem}
.melding{max-width:var(--blad);margin:0 auto .8rem;color:#d9c393;font-size:.85rem;text-align:center}
textarea,input[type=password]{width:100%;font:inherit;background:rgba(255,255,255,.5);border:1px solid var(--perkament-schaduw);color:var(--inkt);padding:.5rem}
.wacht{font-family:var(--hand);color:var(--inkt-bleek)}
</style>
</head>
<body>
<div class="ontwikkel">
  <button class="herstart" onclick="springNaarKaart()" title="Sla de proloog over en spring direct naar de kaart in Beversluis">⇥ Naar de kaart</button>
  <button id="herstart" class="herstart" onclick="opnieuw()" title="Wis de kroniek en begin opnieuw bij de smidse">⟲ Herstart</button>
</div>
<main id="app" aria-live="polite"></main>
<nav class="riem" id="riem"></nav>

<script>
"use strict";
/* =====================================================================
   RENZE ROODBAARD — raamwerk, proloog compleet
   Eén bestand, geen buildstap, draait op GitHub Pages.
   ===================================================================== */

/* ---------------------------------------------------------------------
   1. OPSLAG — localStorage met geheugen-fallback (artifact-venster blokkeert opslag)
   --------------------------------------------------------------------- */
const OPSLAG = (() => {
  const sleutel = "renze_roodbaard";
  let echt = true;
  try { localStorage.setItem("_t","1"); localStorage.removeItem("_t"); } catch(e){ echt = false; }
  let geheugen = null;
  return {
    duurzaam: echt,
    lees(){
      try { return echt ? JSON.parse(localStorage.getItem(sleutel)) : geheugen; }
      catch(e){ return null; }
    },
    schrijf(s){
      try { echt ? localStorage.setItem(sleutel, JSON.stringify(s)) : (geheugen = JSON.parse(JSON.stringify(s))); }
      catch(e){ echt = false; geheugen = s; }
    },
    wis(){ try{ localStorage.removeItem(sleutel); }catch(e){} geheugen = null; }
  };
})();

/* ---------------------------------------------------------------------
   2. ASSETS — vaste paden; ontbreekt het bestand, dan verschijnt de ets
   --------------------------------------------------------------------- */
const ASSETS = {
  landkaart:   "assets/kaarten/landkaart.webp",
  beversluis_plattegrond: "assets/kaarten/beversluis-plattegrond.webp",
  galgenboom:  "assets/scene/galgenboom.webp",
  wegkapel:    "assets/scene/wegkapel.webp",
  wegkapel_leeg: "assets/scene/wegkapel-leeg.webp",
  smidse:      "assets/scene/smidse.webp",
  vier_eiken:  "assets/scene/vier-eiken.webp",
  duel:        "assets/scene/duel.webp",
  sterfbed:    "assets/scene/sterfbed.webp",

  linnen_hemd:      "assets/kleding/linnen-hemd.webp",
  gelapt_wambuis:   "assets/kleding/gelapt-wambuis.webp",
  gevechtspak:      "assets/kleding/leren-kolder.webp",
  malienkolder:     "assets/kleding/malienkolder.webp",
  harnas_gerlof:    "assets/kleding/harnas.webp",
  jachtmes:    "assets/wapen/jachtmes.webp",
  knuppel:     "assets/wapen/knuppel.webp",
  zwaard:      "assets/wapen/zwaard-van-weel.webp",

  steeg:       "assets/scene/steeg.webp",
  kruispunt:   "assets/scene/kruispunt.webp",
  kerker:      "assets/scene/kerker.webp"
};

/* Inkt-etsen: de terugval, bewust in stijl en niet als foutmelding */
const ETSEN = {
  smidse:`<svg viewBox="0 0 120 80"><g stroke="#241a10" fill="none" stroke-width="1.6" stroke-linecap="round">
    <path d="M20 62h34l-4-14H24z"/><path d="M18 62h40" stroke-width="2.4"/>
    <path d="M62 30l22-8 6 7-22 9z" fill="#241a10" opacity=".85"/><path d="M64 34l-16 22"/>

  vier_eiken:`<svg viewBox="0 0 120 80"><g stroke="#241a10" fill="none" stroke-width="1.5" stroke-linecap="round">

  duel:`<svg viewBox="0 0 120 80"><g stroke="#241a10" fill="none" stroke-width="2" stroke-linecap="round">
    <path d="M18 66L84 16"/><path d="M102 66L36 16"/>
    <path d="M76 10l12 4-4 12" stroke-width="1.4"/><path d="M44 10L32 14l4 12" stroke-width="1.4"/>

  linnen_hemd:`<svg viewBox="0 0 60 60"><g stroke="#241a10" fill="none" stroke-width="1.6"><path d="M22 12l-10 6 4 8 4-2v24h20V24l4 2 4-8-10-6z"/><path d="M22 12c2 4 6 4 8 0" /></g></svg>`,
  gelapt_wambuis:`<svg viewBox="0 0 60 60"><g stroke="#241a10" fill="none" stroke-width="1.6"><path d="M20 12l-8 8 5 6v22h26V26l5-6-8-8z"/><path d="M30 16v32"/><path d="M34 30h8v8h-8z" stroke-dasharray="2 2"/></g></svg>`,
  gevechtspak:`<svg viewBox="0 0 60 60"><g stroke="#241a10" fill="none" stroke-width="1.6"><path d="M18 14h24v30a8 8 0 01-8 6h-8a8 8 0 01-8-6z"/><path d="M18 22h24M18 30h24M18 38h24" opacity=".55"/><path d="M30 14v36" opacity=".4"/></g></svg>`,
  malienkolder:`<svg viewBox="0 0 60 60"><g stroke="#241a10" fill="none" stroke-width="1.3"><path d="M18 14h24v32H18z"/><g opacity=".65"><circle cx="23" cy="20" r="2"/><circle cx="30" cy="20" r="2"/><circle cx="37" cy="20" r="2"/><circle cx="23" cy="27" r="2"/><circle cx="30" cy="27" r="2"/><circle cx="37" cy="27" r="2"/><circle cx="23" cy="34" r="2"/><circle cx="30" cy="34" r="2"/><circle cx="37" cy="34" r="2"/><circle cx="26" cy="41" r="2"/><circle cx="34" cy="41" r="2"/></g></g></svg>`,
  harnas_gerlof:`<svg viewBox="0 0 60 60"><g stroke="#241a10" fill="none" stroke-width="1.7"><path d="M22 12h16l6 8-4 6 4 6-6 4v14H24V36l-6-4 4-6-4-6z"/><path d="M30 20v26" opacity=".5"/><path d="M24 30h12" opacity=".5"/></g></svg>`,
  jachtmes:`<svg viewBox="0 0 60 60"><g stroke="#241a10" fill="none" stroke-width="1.7" stroke-linecap="round"><path d="M14 44l22-22 6 2-22 22z"/><path d="M40 20l6-6"/><path d="M12 46l6 2" stroke-width="2.4"/></g></svg>`,

const VERSIE = 3;

function nieuweStaat(){
  return {
    v: VERSIE,
    scene: "smidse",
    weergave: "verhaal",
    naam: "Renze",
    toenaam: null,
    munten: 0,
    eer: 0,
    gerucht: 0,
    gezocht: 0,
    locatie: null,
    fluisters: [],
    vlaggen: {},
    dracht: {onder:"linnen_hemd", midden:"gelapt_wambuis", harnas:null, wapen:null},
    kist: ["linnen_hemd","gelapt_wambuis","jachtmes"],
    manschappen: [],
    inschrijvingen: [
      {tekst:"Renze, zoon van Wibbe de smid, van Hooiveld. Zeventien winters.", hand:1},
      {tekst:"Beroep: knecht in de smidse van zijn vader.", hand:1, sleutel:"beroep"}
    ],
    kroniek: {aan:false, sleutel:""},
    gezegeld: false
  };
}

function migreer(s){
  if(!s || typeof s !== "object") return nieuweStaat();
  if(s.v === 1){ s = Object.assign({}, s, {gezocht: s.gezocht || 0, v: 2}); }
  if(s.v === 2){ s = Object.assign({}, s, {locatie: s.locatie || null, v: 3}); }
  if(s.v === VERSIE) return s;
  const schoon = nieuweStaat();
  return Object.assign(schoon, s, {v: VERSIE});
}

let S = migreer(OPSLAG.lees());
function bewaar(){ OPSLAG.schrijf(S); }

/* Afgeleide waarden */
function gedragen(){ return ["onder","midden","harnas","wapen"].map(l=>S.dracht[l]).filter(Boolean).map(i=>ITEMS[i]); }
function som(veld){ return gedragen().reduce((t,i)=>t+(i[veld]||0),0); }
function uithouding(){ return Math.max(2, 12 - som("gewicht")); }
function ontzag(){ return som("ontzag"); }
function onopvallend(){ return Math.max(0, 10 - som("opval")); }
function bereik(){ const w = S.dracht.wapen; return w ? (ITEMS[w].bereik||0) : 0; }

function schrijf(tekst, hand, sleutel){
  if(sleutel){ const oud = S.inschrijvingen.find(i=>i.sleutel===sleutel); if(oud) oud.doorgestreept = true; }
  S.inschrijvingen.push({tekst, hand: hand||2, sleutel});
}
function fluister(tekst, punten){
  S.gerucht += (punten||1);
  S.fluisters.push(tekst);
}

/* ---------------------------------------------------------------------
   5b. HOOFDSTUK 1 — spionage en het kruispunt (dynamische afloopscenes)
   --------------------------------------------------------------------- */
function spionageAfloop(methode){
  let tekst = [];
  let succes = false;
  if(methode === "omkopen"){
    if(S.munten >= 15){
      S.munten -= 15;
      succes = true;
      tekst.push("Vijftien penningen wisselen van hand in een hoek van de herberg, en een naam komt terug: Onno, de wachter bij de noordpoort, telt al een jaar te weinig zakken.");
    } else {
      tekst.push("Je hebt het zilver niet dat dit werk vraagt. Je gaat met lege handen terug naar de kanselier.");
    }
  } else if(methode === "dreigen"){
    succes = (ontzag() + Math.random()*5) >= 6;
    tekst.push(succes
      ? "Eén knecht houdt het twee vragen vol. Bij de derde noemt hij Onno, de wachter bij de noordpoort."
      : "Ze houden hun mond stijver dan je verwachtte van mannen die koren tellen. Wel weet nu heel het pakhuis dat er een ridder rondvraagt naar hun tellingen.");
    if(!succes) fluister("Bij het korenpakhuis vroeg een ridder met een rode baard dingen die hij niet hoorde te vragen.",2);
  } else if(methode === "sluipen"){
    succes = (onopvallend() + Math.random()*6) >= 9;
    tekst.push(succes
      ? "Je vindt de valse balk in het pakhuis vóór het licht wordt: een dubbele bodem, en een lijst met namen die niet de koning dient. Bovenaan staat Onno, de wachter bij de noordpoort."
      : "Een hond slaat aan voordat je bij de balk bent. Je bent weg voordat er een gezicht bij je naam komt, maar zeker weet je dat niet.");
  }

  if(succes){
    S.munten += 25;
    S.eer += 2;
    schrijf("Ontmaskerde in het geheim de graanhandelaar Onno voor de kanselier van Beversluis.",2);
    tekst.push("De kanselier betaalt vijfentwintig penningen zonder te knikken. Dit soort werk staat in geen enkele kroniek, en dat is precies de bedoeling.");
  } else {
    S.eer = Math.max(0, S.eer-1);
    tekst.push("De kanselier zegt niets over falen. Hij noteert het wel.");
  }

  SCENES.spionage_afloop = {
    plaat:"kanselier", kop:"Terug bij de kanselier", titel: succes ? "Een naam, geen gerucht" : "Niets om te melden",
    tekst,
    keuzes:[{tekst:"Terug naar Beversluis.", naar:"hoofdstuk1"}]
  };
}

function berovenPoging(soort){
  if(S.gezocht >= 3){ return gevangenNemen(soort); }
  const buit = soort === "klein" ? 5 + Math.floor(Math.random()*6) : 15 + Math.floor(Math.random()*16);
  const risico = soort === "klein" ? 0.25 : 0.55;
  const ontsnapt = Math.random() > (risico - onopvallend()*0.03);
  if(!ontsnapt){ return gevangenNemen(soort); }

  S.munten += buit;
  S.gezocht = (S.gezocht||0) + 1;
  S.eer = Math.max(0, S.eer-1);
  fluister(soort === "klein"
    ? "Een koopman uit Hooiveld werd bij het kruispunt beroofd door een man met een rode baard."
    : "De graankar van de tollenaar is niet aangekomen in Beversluis. Men fluistert een naam.", soort === "klein" ? 2 : 4);
  schrijf(`Beroofde ${soort==="klein"?"een eenzame reiziger":"de graankar van de tollenaar"} bij het kruispunt. ${buit} penningen.`,2);

  SCENES.beroven_afloop = {
    plaat:"kruispunt", kop:"Het kruispunt", titel:"Buit",
    tekst:[
      `Het gaat snel en het gaat stil. Je telt ${buit} penningen bij het licht van de maan en voelt niets bijzonders, wat je zelf het meest verontrust.`,
      S.gezocht >= 2 ? "Dit is niet de eerste keer. Er wordt naar je gezocht, ook al weet nog niemand welk gezicht daarbij hoort." : "Niemand heeft je gezien. Voor zover je weet."
    ],
    keuzes:[{tekst:"Terug naar Beversluis.", naar:"hoofdstuk1"}]
  };
  return "beroven_afloop";
}

function gevangenNemen(soort){
  const harnasKwijt = !!S.dracht.harnas;
  S.dracht.harnas = null;
  S.eer = Math.max(0, S.eer-5);
  const verloren = Math.min(S.munten, 10 + Math.floor(Math.random()*20));
  S.munten -= verloren;
  schrijf("Gevangen genomen bij het kruispunt en naar de kerker van Beversluis gebracht.",3,"vrijheid");

  SCENES.kerker = {
    plaat:"kerker", kop:"De kerker onder Beversluis, dagen zonder licht", titel:"Tussen zeer magere mannen",
    tekst:[
      "De cel is te laag om in te staan en te nat om in te liggen. De andere gevangenen zijn dun geworden op een manier die niets met vasten te maken heeft; hun ribben tellen mee als kalenderdagen.",
      harnasKwijt ? "Het harnas van Weel hangt nu ergens in het wapenhuis van de schout, op naam van een ander." : "Wat je bezat is geteld, gewogen en ingenomen.",
      `Je verliest ${verloren} penningen aan boetes die niemand je toont op papier. De schout komt zelf kijken, niet om te straffen, maar om te onthouden welk gezicht bij welke naam hoort.`,
      "Na verloop van tijd word je vrijgelaten. Niemand zegt waarom. Misschien is een cel meer waard met een levende gevangene die weer iets kan verdienen dat de schout kan afnemen."
    ],
    keuzes:[{tekst:"De poort uit, het daglicht in.", naar:"hoofdstuk1",
      doe(){ S.gezocht = 0; schrijf("Vrijgelaten uit de kerker van Beversluis, magerder dan hij er in ging.",2); }}]
  };
  return "kerker";
}

  const gebruikt = new Set(S.manschappen.map(m=>m.naam));

let reis = null;

function reisKiezen(naar){
  reis = {fase:"route", naar};
  render();
}

function reisAnnuleren(){
  reis = null;
  render();
}

function reisStart(routeId){
  const opties = ROUTES[routeKey(S.locatie, reis.naar)] || [];
  const route = opties.find(r=>r.id===routeId);
  if(!route || (route.vergrendeld && route.vergrendeld())) return;
  reis = {fase:"onderweg", route, van:S.locatie, naar:reis.naar, etappe:0, gebeurtenis:null, uitkomst:null};
  reisEtappe();
}

function reisEtappe(){
  reis.etappe += 1;
  reis.uitkomst = null;
  reis.gebeurtenis = null;
  reis.galgenboom = null;
  reis.wegkapel = false;
  reis.wegkapelLeeg = false;
  if(reis.etappe > reis.route.etappes){
    const van = PLAATSEN[reis.van].naam, naar = PLAATSEN[reis.naar].naam;
    schrijf(`Reisde van ${van} naar ${naar} — ${reis.route.naam}.`,2);
    S.locatie = reis.naar;
    reis = null;
    bewaar(); render();
    return;
  }
  if(reis.route.passeertGalgenboom && !S.vlaggen.galgenboom_lot && reis.etappe === 1){
    reis.galgenboom = "keuze";
    bewaar(); render();
    return;
  }
  if(reis.route.passeertWegkapel && !S.vlaggen.wegkapel_lot && reis.etappe === 1){
    reis.wegkapel = true;
    bewaar(); render();
    return;
  }
  if(reis.route.passeertWegkapel && S.vlaggen.wegkapel_lot && S.vlaggen.wegkapel_lot !== "gestolen"
     && !S.vlaggen.wegkapel_leeg_gezien && reis.etappe === 1){
    reis.wegkapelLeeg = true;
    bewaar(); render();
    return;
  }
  const pot = reis.route.gebeurtenissen;
  reis.gebeurtenis = Math.random() < reis.route.risico
    ? pot[Math.floor(Math.random()*pot.length)]
    : null;
  if(!reis.gebeurtenis) reis.uitkomst = "De weg is hier stil. Niets bijzonders.";
  bewaar(); render();
}

function reisNegeren(){
  reis.uitkomst = reis.gebeurtenis.negerenTekst;
  reis.gebeurtenis = null;
  bewaar(); render();
}

function reisStilstaanDoen(){
  reis.uitkomst = reis.gebeurtenis.stilstaan();
  reis.gebeurtenis = null;
  bewaar(); render();
}

function reisVerder(){
  reisEtappe();
}

/* De galgenboom: een eenmalige, gescripte ontmoeting die de eerste keer
   optreedt dat een pad er langs komt (niet aan het toeval overgelaten,
   zoals de gewone reisgebeurtenissen). De keuze wordt onthouden in
   S.vlaggen.galgenboom_lot en kan door latere inhoud worden opgepikt. */
function galgenboomKiezen(keuze){
  if(keuze === "redden"){
    reis.galgenboom = "bestemming";
    bewaar(); render();
    return;
  }
  S.vlaggen.galgenboom_lot = keuze;
  if(keuze === "laten"){
    schrijf("Liet een levende man hangen aan de galgenboom, verrader op zijn borst geschreven.",2);
    reis.uitkomst = "Je laat hem hangen. Zijn hoofd komt net omhoog als je wegrijdt — genoeg om je gezicht te zien en te onthouden. De raven wachten geduldiger dan jij.";
  } else {
    S.eer = Math.max(0, S.eer - 1);
    schrijf("Gaf een gehangen man de genadedolk bij de galgenboom.",2);
    reis.uitkomst = "Eén stoot, onder de ribben, kort. Je snijdt hem pas daarna los, uit fatsoen dat de strop hem niet gunde. Wie hij ook was — verrader of een naam die de kanselier nog mist — de aarde krijgt hem, niet de kraaien.";
  }
  reis.galgenboom = null;
  bewaar(); render();
}

function galgenboomRedden(naarId){
  S.vlaggen.galgenboom_lot = "gered";
  S.vlaggen.verrader_naar = naarId;
  const naam = PLAATSEN[naarId].naam;
  schrijf(`Sneed een gehangen man los bij de galgenboom en bracht hem, gewond, naar ${naam}.`,2);
  S.locatie = naarId;
  reis = null;
  bewaar(); render(); window.scrollTo({top:0});
}

/* De wegkapel: net als de galgenboom een eenmalige gescripte ontmoeting,
   de eerste keer dat een pad er langs komt. Geen aparte etappe-onderbreking
   nodig — de reis loopt na de keuze gewoon door. */
function wegkapelKiezen(keuze){
  S.vlaggen.wegkapel_lot = keuze;
  if(keuze === "gebeden"){
    S.eer += 1;
    schrijf("Bad kort bij een onverwacht kostbaar Mariabeeld in een wegkapel.",2);
    reis.uitkomst = "Je knielt kort op de vochtige vloer. De kaarsen flakkeren met de tocht van de deuropening, maar niet één dooft. Wie dit beeld hier zette, en waarom, vraag je niet. Buiten wacht het pad.";
  } else if(keuze === "gestolen"){
    const vondst = 35 + Math.floor(Math.random()*21);
    S.munten += vondst;
    S.eer = Math.max(0, S.eer - 4);
    schrijf(`Nam een kostbaar Mariabeeld mee uit een wegkapel — ${vondst} penningen waard.`,2);
    reis.uitkomst = `Het beeld is zwaarder dan het eruitziet, en kouder dan gewijd goud hoort te zijn. Je wikkelt het in je mantel voor iemand het mist. ${vondst} penningen, schat je, misschien meer in Beversluis. Een kapelletje van baksteen en verweerd hout bewaart geen beeld dat een stad kan kopen zonder dat iemand zich dat ooit afvraagt.`;
  } else {
    const gift = Math.min(S.munten, 2 + Math.floor(Math.random()*4));
    S.munten -= gift;
    S.eer += 2;
    schrijf("Liet een gift achter bij een wegkapel met een onverwacht kostbaar Mariabeeld.",2);
    reis.uitkomst = `Je legt ${gift > 0 ? gift + " penningen" : "wat je hebt"} bij de andere gaven op het altaarkleed — linten, een verdorde bloem, een kinderschoentje. Het is niets vergeleken met wat er al staat te branden. Het voelt toch als het enige juiste wat je vandaag hebt gedaan.`;
  }
  reis.wegkapel = false;
  bewaar(); render();
}

/* De wegkapel, tweede keer: alleen te zien als het beeld er bij de eerste
   ontmoeting nog stond (niet als de speler het zelf al meenam). */
function wegkapelLeegKiezen(keuze){
  S.vlaggen.wegkapel_leeg_gezien = true;
  if(keuze === "onderzoek"){
    S.vlaggen.wegkapel_sporen_onderzocht = true;
    fluister("Bij de lege wegkapel gezien: hoefsporen geschoeid als een leger, en een gescheurde rood-witte doek — geen rovers, geen dievenwerk.",1);
    schrijf("Onderzocht de sporen bij de lege wegkapel: geschoeide paarden, geen rovers.",2);
    reis.uitkomst = "De afdrukken zijn vers en geschoeid — geen boerenpaarden, geen rovers te voet. Wie dit deed, kwam met meerdere, gewapend, en nam de tijd om de kaarsen om te schoppen voor ze vertrokken. Dat is geen diefstal. Dat is een boodschap, en je weet nog niet aan wie.";
  } else if(keuze === "doek"){
    S.vlaggen.heeft_wegkapel_doek = true;
    schrijf("Raapte een gescheurd stuk van een rood-witte ridderscape op bij de lege wegkapel.",2);
    reis.uitkomst = "Je raapt de doek op. Wit, met een striem rood die niet is vervaagd — verf noch bloed alleen, maar iets van allebei. Het is gescheurd van een mantel, de snit van een ridder, niet van een boer of een dief. Je vouwt het klein en stopt het weg. Ooit vind je bij wie het hoort.";
  } else {
    schrijf("Reed voorbij de lege wegkapel zonder om te kijken.",2);
    reis.uitkomst = "Wat hier gebeurde, is niet meer te veranderen door ernaar te staren. Je rijdt door, en probeert niet te denken aan wie hier met zoveel paarden kwam voor zo weinig buit.";
  }
  reis.wegkapelLeeg = false;
  bewaar(); render();
}

/* ---------------------------------------------------------------------
   6. DUEL — tempo en intentie. Stoot > Binden > Wijken > Stoot
   --------------------------------------------------------------------- */
const INTENTIES = {
  stoot:  {naam:"Stoot",  verslaat:"binden", uit:2, hint:"hij houdt zijn mes laag"},
  binden: {naam:"Binden", verslaat:"wijken", uit:1, hint:"hij zoekt je kling"},
  wijken: {naam:"Wijken", verslaat:"stoot",  uit:0, hint:"hij haalt uit"}
};
let duel = null;

/* Context per duel: welke tekst, wie de tegenstander is, en wat winst/verlies betekent. */
const PROLOOG_DUEL_CTX = {
  plaatId:"duel",
  kop:"Vier Eiken, tussen de wortels", titel:"Het duel",
  vijandLabel:"De rover", vijandInfo:"mes, kort bereik",
  raadFluisteraar:"Van Weel, halfluid",
  gewonnenTekst:[
    "Hij laat het mes vallen voordat je hem raakt. Dat doet iemand die dit vaker heeft gedaan en die weet wanneer het over is.",
    "Je bindt hem met je eigen gordel. Achter je zegt Van Weel: «Goed.» En daarna niets meer, wat je pas veel later begrijpt."
  ],
  verlorenTekst:[
    "Je ligt in de bladeren en de lucht wil niet naar binnen. Boven je gaat iets snel en zwaar, en dan is het stil.",
    "Van Weel staat over je heen met de rover onder zijn knie. Hij hijgt door zijn tanden. «Sta op,» zegt hij. «Bind hem.» Er zit iets donkers onder zijn kolder, links."
  ],
  afGewonnen(){
    S.eer += 2;
    schrijf("Nam bij Vier Eiken eigenhandig de rover gevangen die drie reizigers had beroofd.",2);
    if(!S.kist.includes("gevechtspak")) S.kist.push("gevechtspak");
    ga("sterfbed");
  },
  afVerloren(){
    S.vlaggen.gerlof_greep_in = true;
    schrijf("Werd bij Vier Eiken van de grond geraapt door Gerlof van Weel, die daarbij het mes ving.",2);
    if(!S.kist.includes("gevechtspak")) S.kist.push("gevechtspak");
    ga("sterfbed");
  }
};

const REIZIGERS_DUEL_CTX = {
  plaatId:"karavaan",
  kop:"De bocht bij de Zwarte Ley", titel:"Vooraan rijden",
  vijandLabel:"De wegbandiet", vijandInfo:"kort zwaard, oud litteken",
  raadFluisteraar:"Een van de wagenmenners, gespannen",
  gewonnenTekst:[
    "Hij gaat neer in de modder naast zijn eigen wapen en blijft liggen, wat verstandiger is dan opstaan.",
    "De karavaanmeester telt de wagens. Drie op drie. Zijn zoon kijkt naar je alsof hij net besloten heeft wat hij wil worden."
  ],
  verlorenTekst:[
    "Je wijkt te laat en de wond is dieper dan hij zich meteen voelt. De bandiet grist een zak van de achterste wagen en verdwijnt tussen de bomen voor iemand hem kan volgen.",
    "De karavaanmeester zegt niets tegen je. Dat is erger dan wat hij had kunnen zeggen."
  ],
  afGewonnen(){

  },
  afVerloren(){

};

const DIEVEN_DUEL_CTX = {
  plaatId:"steeg",
  kop:"Een steeg achter de graanmarkt", titel:"De schout wijst een naam",

  gewonnenTekst:[
    "Hij rent zich vast in een blinde muur en jij bent sneller op adem dan hij.",

  ],

  ],
  afGewonnen(){
    S.munten += 12; S.eer += 1;
    schrijf("Ving een dief in de stegen achter de graanmarkt van Beversluis, in opdracht van de schout.",2);

};

function duelStart(ctx){
  duel = {
    ctx: ctx || PROLOOG_DUEL_CTX,
    houding: 4,
    vijand: 4,
    kracht: uithouding(),
    log: [],
    vorige: null,
    verloren: false,
    raad: null,
    klaar: false
  };
  const v = S.vlaggen.voordeel;
  if(v === "spoor"){ duel.vijand = 3; duel.log.push({t:"Je wist waar hij stond voordat hij wist waar jij stond.",k:"goed"}); }
  if(v === "verrassing"){ duel.vijand = 3; duel.kracht += 1; duel.log.push({t:"Hij herkent je niet als gevaar. Dat duurt één slag.",k:"goed"}); }
  if(v === "donker"){ duel.log.push({t:"Het donker verbergt jullie beiden even goed.",k:""}); }
  if(S.vlaggen.vermoeid) duel.kracht -= 2;
  delete S.vlaggen.voordeel;
  delete S.vlaggen.vermoeid;
  if(S.manschappen.length){
    duel.vijand = Math.max(1, duel.vijand - 1);
    duel.log.push({t:"Twee van je mannen dekken je rug vanaf de rand van het pad.",k:"goed"});
  }
  duelRaad();
}

function duelKeuzeVijand(){
  // Leesbaar patroon: na verlies herhaalt hij, anders roteert hij.
  if(duel.verloren && duel.vorige) return duel.vorige;
  const r = Object.keys(INTENTIES);
  return r[Math.floor(Math.random()*r.length)];
}

function duelRaad(){
  duel.vijandKeuze = duelKeuzeVijand();
  const eerlijk = Math.random() < 0.7;
  const keys = Object.keys(INTENTIES);
  const gok = eerlijk ? duel.vijandKeuze : keys[Math.floor(Math.random()*keys.length)];
  duel.raad = INTENTIES[gok].hint;
}

function duelBeat(mijn){
  const zijn = duel.vijandKeuze;
  const kost = INTENTIES[mijn].uit;
  duel.kracht -= kost;
  let uitkomst;

  if(mijn === zijn){
    uitkomst = "Staal op staal. Jullie staan stil en ademen.";
    duel.kracht -= 1;
    duel.verloren = false;
  } else if(INTENTIES[mijn].verslaat === zijn){
    let schade = 1 + (bereik() >= 2 && mijn !== "stoot" ? 1 : 0);
    if(duel.kracht <= 2){ schade = 1; uitkomst = "Je komt door, maar je arm is te zwaar om het af te maken."; }
    else uitkomst = "Je leest hem goed. Hij wijkt en bloedt.";
    duel.vijand -= schade;
    duel.verloren = false;
  } else {
    let schade = 1;
    if(S.dracht.harnas || S.dracht.midden === "malienkolder"){ schade = 0; uitkomst = "Zijn mes vindt je zij en glijdt weg over ijzer."; }
    else if(S.dracht.midden === "gevechtspak"){ uitkomst = "Het leer neemt de punt. Je voelt het morgen, niet nu."; }
    else uitkomst = "Hij haalt je open boven de heup.";
    duel.houding -= schade;
    duel.verloren = true;
  }

  duel.vorige = zijn;
  duel.log.unshift({t:uitkomst, k: duel.verloren ? "slecht" : "goed"});
  if(duel.log.length > 4) duel.log.pop();

  if(duel.vijand <= 0){ duel.klaar = "gewonnen"; }
  else if(duel.houding <= 0 || duel.kracht <= 0){ duel.klaar = "verloren"; }
  else duelRaad();
  render();
}

function duelAf(){
  const ctx = duel.ctx;
  const gewonnen = duel.klaar === "gewonnen";
  duel = null;
  if(gewonnen) ctx.afGewonnen(); else ctx.afVerloren();
}

/* ---------------------------------------------------------------------
   7. NAVIGATIE
   --------------------------------------------------------------------- */
function ga(id, duelCtx){
  if(id === "uitrusting_les"){
    S.vlaggen.les_uitrusting = true;
    if(!S.kist.includes("gevechtspak")) S.kist.push("gevechtspak");
    S.scene = "uitrusting_les";
    S.weergave = "uitrusting";
  } else if(id === "duel"){
    S.scene = "duel"; S.weergave = "verhaal"; duelStart(duelCtx);
  } else {
    S.scene = id; S.weergave = "verhaal";
  }
  bewaar(); render(); window.scrollTo({top:0,behavior:"instant"});
}

function kies(sceneId, index){
  const k = SCENES[sceneId].keuzes[index];
  const overschrijving = k.doe ? k.doe() : undefined;
  bewaar();
  if(k.naar === "duel" && k.duelCtx) ga("duel", typeof k.duelCtx === "function" ? k.duelCtx() : k.duelCtx);
  else ga(overschrijving || k.naar);
}

/* ---------------------------------------------------------------------
   8. WEERGAVEN
   --------------------------------------------------------------------- */
const app = document.getElementById("app");

function toonVerhaal(){
  if(S.scene === "duel") return toonDuel();
  if(S.scene === "uitrusting_les"){ S.weergave = "uitrusting"; return toonUitrusting(); }

  const sc = SCENES[S.scene];
  if(!sc) return `<div class="blad"><p>Dit blad is nog niet beschreven.</p></div>`;

  let h = `<article class="blad">`;
  if(sc.plaat) h += plaat(sc.plaat);
  h += `<p class="kop">${sc.kop}</p><h1>${sc.titel}</h1>`;
  h += sc.tekst.map(p=>`<p>${p}</p>`).join("");

  if(sc.slot){
    h += `<hr class="regel">${zegelSvg(S.vlaggen.zegelnieuw)}`;
    S.vlaggen.zegelnieuw = false;
    h += `<p class="label" style="text-align:center;margin-top:.6rem">Renze Roodbaard · eer ${S.eer} · ${S.munten} penningen</p>`;
    h += `<hr class="regel"><p class="label">Hoofdstuk 1</p>
      <div class="keuzes">
        <button class="keuze" onclick="ga('kanselier_kaart')">Naar Beversluis<small>Spionage, karavanen, dieven — en de weg die je niet zou moeten kiezen.</small></button>
      </div>`;
    h += `<p style="margin-top:1rem"><button class="knop knop--stil" onclick="opnieuw()">Begin een nieuwe kroniek</button></p>`;
  } else if(sc.keuzes){
    h += `<hr class="regel"><div class="keuzes">` + sc.keuzes.map((k,i)=>
      `<button class="keuze" onclick="kies('${S.scene}',${i})">${k.tekst}${k.onder?`<small>${k.onder}</small>`:""}</button>`
    ).join("") + `</div>`;
  } else if(sc.naar){
    h += `<hr class="regel"><button class="knop" onclick="ga('${sc.naar}')">Verder</button>`;
  }
  h += `</article>`;
  return h;
}

function toonDuel(){
  if(duel === null) duelStart();
  const ctx = duel.ctx;
  let h = `<article class="blad">${plaat(ctx.plaatId||"duel")}
    <p class="kop">${ctx.kop}</p><h1>${ctx.titel}</h1>`;

  if(!duel.klaar){
    h += `<div class="tegen">
      <div><span class="label">Jij</span><div class="balk"><i style="width:${duel.houding/4*100}%"></i></div>
        <span class="cijfers" style="font-size:.8rem">kracht ${Math.max(0,duel.kracht)}</span></div>
      <div><span class="label">${ctx.vijandLabel}</span><div class="balk"><i style="width:${Math.max(0,duel.vijand)/4*100}%"></i></div>
        <span class="cijfers" style="font-size:.8rem">${ctx.vijandInfo}</span></div>
    </div>`;
    h += `<p class="raad">${ctx.raadFluisteraar}: «${duel.raad}.»</p>`;
    h += duel.log.map(l=>`<p class="beat" style="border-left-color:${l.k==="slecht"?"var(--zegel)":"var(--inkt-bleek)"}">${l.t}</p>`).join("");
    h += `<hr class="regel"><div class="keuzes">
      <button class="keuze" onclick="duelBeat('stoot')">Stoot<small>Verslaat binden. Kost twee kracht.</small></button>
      <button class="keuze" onclick="duelBeat('binden')">Binden<small>Verslaat wijken. Kost één kracht.</small></button>
      <button class="keuze" onclick="duelBeat('wijken')">Wijken<small>Verslaat de stoot. Kost geen kracht.</small></button>
    </div>`;
  } else if(duel.klaar === "gewonnen"){
    h += ctx.gewonnenTekst.map(p=>`<p>${p}</p>`).join("") + `<hr class="regel"><button class="knop" onclick="duelAf()">Verder</button>`;
  } else {
    h += ctx.verlorenTekst.map(p=>`<p>${p}</p>`).join("") + `<hr class="regel"><button class="knop" onclick="duelAf()">Verder</button>`;
  }
  return h + `</article>`;
}

function toonUitrusting(){
  const les = S.scene === "uitrusting_les";
  let h = "";
  if(les){
    h += `<article class="blad blad--dun">
      <p class="kop">De les van Van Weel</p>
      <p style="margin:0">Kies wat je aantrekt. Gewicht kost kracht in het gevecht, ontzag opent deuren, opvallendheid sluit ze weer. Trek de kolder aan en ga verder.</p>
    </article>`;
  }
  h += `<article class="blad"><p class="kop">Uitrusting</p><h1>Wat je draagt</h1>
    <div class="waarden">
      <div class="waarde"><span class="label">Kracht</span><b>${uithouding()}</b></div>
      <div class="waarde"><span class="label">Ontzag</span><b>${ontzag()}</b></div>
      <div class="waarde"><span class="label">Onopvallend</span><b>${onopvallend()}</b></div>
      <div class="waarde"><span class="label">Gewicht</span><b>${som("gewicht")}</b></div>
    </div><hr class="regel"><div class="lagen">`;

  for(const laag of ["onder","midden","harnas","wapen"]){
    const huidig = S.dracht[laag];
    const opties = S.kist.filter(id=>ITEMS[id].laag===laag);
    h += `<div class="laag">
      <div>${plaat(huidig || "leeg", true)}</div>
      <div>
        <span class="label">${LAAGNAMEN[laag]}</span>
        <div class="naam">${huidig ? ITEMS[huidig].naam : "— niets —"}</div>
        <div class="cijfers">${huidig ? ITEMS[huidig].noot : "Deze laag is leeg."}</div>
        <div class="kies">
          ${opties.map(id=>`<button aria-pressed="${id===huidig}" onclick="trekAan('${laag}','${id}')">${ITEMS[id].naam}</button>`).join("")}
          ${huidig && laag!=="onder" ? `<button onclick="trekAan('${laag}',null)">uit</button>`:""}
        </div>
      </div>
    </div>`;
  }
  h += `</div>`;
  if(les){
    const klaar = S.dracht.midden === "gevechtspak";
    h += `<hr class="regel">
      <button class="knop" ${klaar?"":"disabled style=opacity:.5"} onclick="ga('spoor')">Naar Vier Eiken</button>
      ${klaar?"":`<p class="cijfers" style="margin-top:.5rem">Trek eerst de leren kolder aan.</p>`}`;
  }
  return h + `</article>`;
}

function trekAan(laag, id){
  S.dracht[laag] = id === "null" ? null : id;
  if(id === null) S.dracht[laag] = null;
  bewaar(); render();
}

/* ---------------------------------------------------------------------
   8b. LEGER — dorpelingen werven, trainen, kleden en bewapenen
   --------------------------------------------------------------------- */
function legerWerf(){
  const gebruikt = new Set(S.manschappen.map(m=>m.naam));
  const beschikbaar = DORPSNAMEN.filter(n=>!gebruikt.has(n));
  if(S.munten < 6 || !beschikbaar.length) return;
  S.munten -= 6;
  const naam = beschikbaar[Math.floor(Math.random()*beschikbaar.length)];
  S.manschappen.push({naam, opleiding:0, kleding:"eigen_kleren", wapen:"geen"});
  schrijf(`Wierf ${naam}, een dorpeling, voor het leger.`,2);
  bewaar(); render();
}

function legerTrain(i){
  const m = S.manschappen[i];
  const kosten = OPLEIDINGKOSTEN[m.opleiding];
  if(kosten === undefined || S.munten < kosten) return;
  S.munten -= kosten;
  m.opleiding += 1;
  bewaar(); render();
}

function legerKleed(i, id){
  const m = S.manschappen[i];
  const item = VOLGKLEDING[id];
  if(m.kleding === id || S.munten < item.prijs) return;
  S.munten -= item.prijs;
  m.kleding = id;
  bewaar(); render();
}

function legerBewapen(i, id){
  const m = S.manschappen[i];
  const item = VOLGWAPEN[id];

/* ---------------------------------------------------------------------
   5d. IN- EN UITZOOMEN OP DE KAART — pan/zoom binnen de kaart zelf, zodat
   plekmarkers een vaste grootte houden en relatief kleiner ogen naarmate
   je verder inzoomt (in plaats van mee te schalen met de kaart).
   --------------------------------------------------------------------- */
let kz = {zoom:1, panX:0, panY:0, min:1, max:4};

function kaartToepassenTransform(){
  const vp = document.getElementById("kaartViewport");
  const laag = document.getElementById("kaartZoom");
  if(!vp || !laag) return;
  const w = vp.clientWidth, h = vp.clientHeight;
  kz.panX = Math.min(0, Math.max(w - w*kz.zoom, kz.panX));
  kz.panY = Math.min(0, Math.max(h - h*kz.zoom, kz.panY));
  laag.style.transform = `translate(${kz.panX}px, ${kz.panY}px) scale(${kz.zoom})`;
  vp.classList.toggle("kaart-viewport--gezoomd", kz.zoom > kz.min);
  document.querySelectorAll("#kaartHotspots .hotspot").forEach(btn=>{
    const fx = parseFloat(btn.dataset.fx), fy = parseFloat(btn.dataset.fy);
    btn.style.left = (fx*w*kz.zoom + kz.panX) + "px";
    btn.style.top  = (fy*h*kz.zoom + kz.panY) + "px";
  });
}

function kaartZoomOm(px, py, nieuweZoom){
  nieuweZoom = Math.min(kz.max, Math.max(kz.min, nieuweZoom));
  const mapX = (px - kz.panX) / kz.zoom, mapY = (py - kz.panY) / kz.zoom;
  kz.panX = px - mapX*nieuweZoom;
  kz.panY = py - mapY*nieuweZoom;
  kz.zoom = nieuweZoom;
}

function kaartZoomStap(richting){
  const vp = document.getElementById("kaartViewport");
  if(!vp) return;
  kaartZoomOm(vp.clientWidth/2, vp.clientHeight/2, kz.zoom * (richting > 0 ? 1.5 : 1/1.5));
  kaartToepassenTransform();
}

function kaartZoomReset(){
  kz = {zoom:1, panX:0, panY:0, min:1, max:4};
  kaartToepassenTransform();
}

function kaartInitZoom(){
  const vp = document.getElementById("kaartViewport");
  if(!vp) return;
  kz = {zoom:1, panX:0, panY:0, min:1, max:4};
  kaartToepassenTransform();

  const pointers = new Map();
  let sleept = false, sleepStart = null, vorigeAfstand = null, vorigCentrum = null;
  const afstand = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
  const centrum = (a,b) => ({x:(a.x+b.x)/2, y:(a.y+b.y)/2});

  vp.addEventListener("pointerdown", e=>{
    if(e.target.closest(".hotspot, .kaart-knoppen button")) return;
    try{ vp.setPointerCapture(e.pointerId); }catch(err){}
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pointers.size === 1){
      sleept = true;
      sleepStart = {x:e.clientX, y:e.clientY, panX:kz.panX, panY:kz.panY};
      vp.classList.add("kaart-viewport--sleept");
    } else if(pointers.size === 2){
      sleept = false;
      const [a,b] = [...pointers.values()];
      vorigeAfstand = afstand(a,b);
      vorigCentrum = centrum(a,b);
    }
  });

  vp.addEventListener("pointermove", e=>{
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pointers.size === 1 && sleept && kz.zoom > kz.min){
      e.preventDefault();
      const p = pointers.get(e.pointerId);
      kz.panX = sleepStart.panX + (p.x - sleepStart.x);
      kz.panY = sleepStart.panY + (p.y - sleepStart.y);
      kaartToepassenTransform();
    } else if(pointers.size === 2){
      e.preventDefault();
      const [a,b] = [...pointers.values()];
      const rect = vp.getBoundingClientRect();
      const nieuweAfstand = afstand(a,b);
      const nieuwCentrum = centrum(a,b);
      kaartZoomOm(nieuwCentrum.x-rect.left, nieuwCentrum.y-rect.top, kz.zoom * (nieuweAfstand/vorigeAfstand));
      kz.panX += nieuwCentrum.x - vorigCentrum.x;
      kz.panY += nieuwCentrum.y - vorigCentrum.y;
      kaartToepassenTransform();
      vorigeAfstand = nieuweAfstand;
      vorigCentrum = nieuwCentrum;
    }
  });

  function loslaten(e){
    pointers.delete(e.pointerId);
    if(pointers.size < 2){ vorigeAfstand = null; vorigCentrum = null; }
    if(pointers.size === 0){ sleept = false; vp.classList.remove("kaart-viewport--sleept"); }
  }
  vp.addEventListener("pointerup", loslaten);
  vp.addEventListener("pointercancel", loslaten);
  vp.addEventListener("pointerleave", loslaten);

  vp.addEventListener("wheel", e=>{
    e.preventDefault();
    const rect = vp.getBoundingClientRect();
    kaartZoomOm(e.clientX-rect.left, e.clientY-rect.top, kz.zoom * (e.deltaY < 0 ? 1.2 : 1/1.2));
    kaartToepassenTransform();
  }, {passive:false});

  vp.addEventListener("dblclick", e=>{
    const rect = vp.getBoundingClientRect();
    kaartZoomOm(e.clientX-rect.left, e.clientY-rect.top, kz.zoom < kz.max ? Math.min(kz.max, kz.zoom*2) : kz.min);
    kaartToepassenTransform();
  });
}

  }

  if(S.fluisters.length){
    h += `<hr class="regel"><p class="label">Wat er gefluisterd wordt</p>
      ${S.fluisters.map(f=>`<p class="fluister">«${f}»</p>`).join("")}
      <p class="cijfers">Gerucht staat los van eer. De koning leest je kaart; het land vertelt elkaar iets anders.</p>`;
  }
  if(S.gezegeld) h += zegelSvg(false);
  h += `</article>`;

  h += `<article class="blad blad--dun">
    <p class="label">De kroniekschrijver</p>
    <p style="margin:.3rem 0 .6rem">Zet dit aan en het spel laat geruchten en tafelpraat live schrijven in plaats van uit een vaste lijst te trekken.</p>
    <p style="margin:0 0 .6rem"><button class="knop ${S.kroniek.aan?"":"knop--stil"}" onclick="kroniekToggle()">${S.kroniek.aan?"Kroniekschrijver staat aan":"Kroniekschrijver aanzetten"}</button></p>`;
  if(S.kroniek.aan){
    h += `<p class="cijfers">Binnen Claude werkt dit zonder sleutel. Op GitHub Pages heb je je eigen API-sleutel nodig, of beter: een proxy zoals een Netlify Function, zodat de sleutel niet in de pagina staat.</p>
      <p><input type="password" placeholder="API-sleutel (optioneel, blijft in dit apparaat)" value="${S.kroniek.sleutel||""}" oninput="S.kroniek.sleutel=this.value;bewaar()"></p>
      <p><button class="knop knop--stil" onclick="kroniekVraag()">Laat een gerucht schrijven</button></p>
      <div id="kroniekuit"></div>`;
  }
  h += `<hr class="regel"><p class="cijfers">Opslag: ${OPSLAG.duurzaam?"in dit apparaat bewaard":"alleen in het geheugen (dit venster staat opslag niet toe)"} · versie ${S.v}</p>
    <p><button class="knop knop--stil" onclick="opnieuw()">Wis en begin opnieuw</button></p></article>`;
  return h;
}

/* ---------------------------------------------------------------------
   9. KRONIEKSCHRIJVER — optionele AI-laag
   --------------------------------------------------------------------- */
function kroniekToggle(){ S.kroniek.aan = !S.kroniek.aan; bewaar(); render(); }

async function kroniekVraag(){
  const uit = document.getElementById("kroniekuit");
  uit.innerHTML = `<p class="wacht">De schrijver snijdt zijn pen bij…</p>`;
  const staat = {
    naam: (S.naam + " " + (S.toenaam||"")).trim(),
    eer: S.eer, gerucht: S.gerucht, penningen: S.munten,
    dracht: gedragen().map(i=>i.naam),
    daden: S.inschrijvingen.map(i=>i.tekst),
    bestaandeFluisters: S.fluisters
  };
  const prompt = `Je bent de kroniekschrijver van een middeleeuws spel in het Nederlands. Toon: droog, concreet, zonder pathos, geen moderne woorden.
Spelstaat: ${JSON.stringify(staat)}
Schrijf één nieuw gerucht dat in een herberg over deze ridder verteld wordt. Het moet passen bij zijn daden en bij zijn geruchtwaarde (hoger = kwaadaardiger). Maximaal 30 woorden.
Antwoord met UITSLUITEND JSON, zonder toelichting en zonder markdown: {"fluister":"...","geruchtDelta":0}`;
  try{
    const headers = {"Content-Type":"application/json","anthropic-dangerous-direct-browser-access":"true"};
    if(S.kroniek.sleutel){ headers["x-api-key"] = S.kroniek.sleutel; headers["anthropic-version"] = "2023-06-01"; }
    const r = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST", headers,
      body: JSON.stringify({model:"claude-sonnet-4-6", max_tokens:1000, messages:[{role:"user",content:prompt}]})
    });
    if(!r.ok) throw new Error("status " + r.status);
    const d = await r.json();
    const tekst = (d.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").replace(/```json|```/g,"").trim();
    const j = JSON.parse(tekst);
    fluister(j.fluister, j.geruchtDelta || 0);
    bewaar(); render();
  }catch(e){
    uit.innerHTML = `<p class="cijfers">De schrijver antwoordt niet (${e.message}). Op GitHub Pages heb je een sleutel of een proxy nodig; het spel loopt zonder hem verder.</p>`;
  }
}

/* ---------------------------------------------------------------------
   10. RENDER + riem
   --------------------------------------------------------------------- */
const RIEM = [
  {id:"verhaal",   naam:"Verhaal",  icoon:`<svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h6"/></svg>`},
  {id:"kaart",     naam:"Kaart",    icoon:`<svg viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>`},
  {id:"vel",       naam:"Kaart van Renze", icoon:`<svg viewBox="0 0 24 24"><path d="M6 3h12v18H6z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>`},
  {id:"uitrusting",naam:"Uitrusting",icoon:`<svg viewBox="0 0 24 24"><path d="M9 3h6l3 4-2 3 2 3-3 2v6H9v-6l-3-2 2-3-2-3z"/></svg>`},
  {id:"leger",     naam:"Leger",     icoon:`<svg viewBox="0 0 24 24"><path d="M4 20l3-9 5 5 3-11 5 15"/><circle cx="8" cy="9" r="2"/></svg>`}
];

function render(){
  const w = S.weergave;
  app.innerHTML =
    w === "kaart"      ? toonKaart() :
    w === "vel"        ? toonVel() :
    w === "uitrusting" ? toonUitrusting() :
    w === "leger"      ? toonLeger() :
                         toonVerhaal();
  document.getElementById("riem").innerHTML = RIEM.map(t=>
    `<button aria-current="${t.id===w}" onclick="naar('${t.id}')">${t.icoon}<span>${t.naam}</span></button>`
  ).join("");
  if(w === "kaart") kaartInitZoom();
}
function naar(id){
  if(S.scene === "uitrusting_les" && id !== "uitrusting"){ S.weergave = id; render(); return; }
  S.weergave = id; bewaar(); render();
}
function springNaarKaart(){
  if(!S.vlaggen.heeft_kaart){
    S.gezegeld = true;
    S.toenaam = S.toenaam || "Roodbaard";
    S.eer = S.eer || 5;
    S.munten = S.munten || 30;
    if(!S.kist.includes("gevechtspak")) S.kist.push("gevechtspak");
    if(!S.kist.includes("malienkolder")) S.kist.push("malienkolder","harnas_gerlof","zwaard");
    if(!S.dracht.wapen) S.dracht.wapen = "zwaard";
    S.vlaggen.heeft_kaart = true;
    S.locatie = "beversluis";
    schrijf("(ontwikkelaarssprong) direct naar de kaart in Beversluis, proloog overgeslagen.",2);
  }
  S.scene = "hoofdstuk1";
  S.weergave = "kaart";
  duel = null; reis = null;
  bewaar(); render(); window.scrollTo({top:0});
}
function opnieuw(){
  let door = true;
  try { door = confirm("De hele kroniek wissen en opnieuw beginnen?"); }
  catch(e){ door = true; } // sommige voorvertoningen (sandboxed iframes) staan confirm() niet toe
  if(!door) return;
  OPSLAG.wis(); S = nieuweStaat(); duel = null; reis = null; bewaar(); render(); window.scrollTo({top:0});
}

render();
</script>
